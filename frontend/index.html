<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="神秘悬疑风格的AI海龟汤推理游戏 - 12种主题，4个难度，智能AI出题">
    <meta name="keywords" content="海龟汤,推理游戏,AI游戏,悬疑,逻辑思维">
    <title>神秘海龟汤 - AI推理游戏</title>
    
    <!-- 预加载关键资源 -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://hpi-hub.tos-cn-beijing.volces.com">
    
    <!-- 字体加载 -->
    <link href="https://fonts.loli.net/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chakra UI CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@chakra-ui/css-reset@2.3.0/dist/index.css">
    
    <!-- 图标字体 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 全局样式 -->
    <style>
        /* 基础重置和全局变量 */
        :root {
            /* 暗黑美学配色 */
            --primary-dark: #121212;
            --secondary-dark: #1e1e1e;
            --surface-dark: #2e2e2e;
            
            /* 主题色彩 */
            --midnight-blue: #1a237e;
            --dark-purple: #4a148c;
            --blood-red: #b71c1c;
            --neon-green: #00e676;
            
            /* 渐变 */
            --gradient-primary: linear-gradient(135deg, var(--midnight-blue), var(--dark-purple));
            --gradient-secondary: linear-gradient(145deg, var(--primary-dark), var(--secondary-dark));
            
            /* 文字颜色 */
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --text-muted: #757575;
            --text-accent: var(--neon-green);
            
            /* 边框和阴影 */
            --border-color: rgba(255, 255, 255, 0.1);
            --border-accent: var(--neon-green);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(0, 230, 118, 0.3);
            
            /* 玻璃拟态 */
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-backdrop: blur(8px);
            
            /* 字体 */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            /* 过渡 */
            --transition-base: 0.3s ease;
        }
        
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            font-family: var(--font-family);
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--primary-dark);
            background-image: 
                radial-gradient(circle at 25% 25%, var(--midnight-blue) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, var(--dark-purple) 0%, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--secondary-dark);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--surface-dark);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-green);
        }
        
        /* 选择文本样式 */
        ::selection {
            background: var(--neon-green);
            color: var(--primary-dark);
        }
        
        /* 加载动画 */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--secondary-dark);
            border-top-color: var(--neon-green);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 错误页面样式 */
        .error-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }
        
        .error-title {
            font-size: 2rem;
            color: var(--blood-red);
            margin-bottom: 1rem;
        }
        
        .error-message {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            html {
                font-size: 14px;
            }
            
            body {
                background-attachment: local;
            }
        }
        
        /* 减弱动画偏好 */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.1s !important;
                transition-duration: 0.1s !important;
            }
        }
        

    </style>
</head>
<body>
    <!-- React 应用挂载点 -->
    <div id="root">
        <!-- 加载中状态 -->
        <div class="loading-container" id="app-loading">
            <div style="text-align: center;">
                <div class="loading-spinner"></div>
                <div style="margin-top: 20px; color: var(--text-secondary); font-size: 14px;">
                    正在加载神秘海龟汤游戏...
                </div>
            </div>
        </div>
    </div>
    
    <!-- 错误回退页面 -->
    <div id="error-fallback" class="error-container" style="display: none;">
        <div class="error-title">⚠️ 加载失败</div>
        <div class="error-message">
            游戏加载出现问题，请刷新页面重试<br>
            或检查网络连接后重新访问
        </div>
        <button onclick="location.reload()" style="
            background: var(--neon-green);
            color: var(--primary-dark);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-base);
        ">
            刷新页面
        </button>
    </div>
    

    
    <!-- 预加载图片资源 -->
    <link rel="preload" as="image" href="https://hpi-hub.tos-cn-beijing.volces.com/static/biology/microscopic-8838738_1280.png">
    
    <!-- React 应用入口脚本 -->
    <script type="module" src="/src/index.jsx"></script>
    
    <!-- 错误处理脚本 -->
    <script>
        // 全局错误捕获
        window.addEventListener('error', function(e) {
            console.error('应用加载错误:', e.error);
            showErrorFallback();
        });
        
        window.addEventListener('unhandledrejection', function(e) {
            console.error('未处理的Promise拒绝:', e.reason);
            showErrorFallback();
        });
        
        // 显示错误回退页面
        function showErrorFallback() {
            const loading = document.getElementById('app-loading');
            const errorFallback = document.getElementById('error-fallback');
            
            if (loading) loading.style.display = 'none';
            if (errorFallback) errorFallback.style.display = 'flex';
        }
        
        // 应用加载成功后隐藏加载动画
        window.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const loading = document.getElementById('app-loading');
                if (loading && window.React) {
                    loading.style.opacity = '0';
                    setTimeout(function() {
                        loading.style.display = 'none';
                    }, 500);
                }
            }, 2000);
        });
        
        // 检测浏览器兼容性
        if (!window.fetch || !window.Promise || !window.Map) {
            showErrorFallback();
            document.querySelector('.error-message').innerHTML = 
                '您的浏览器版本过低，请升级到现代浏览器<br>' +
                '推荐使用：Chrome 80+、Firefox 75+、Safari 13+';
        }
    </script>
</body>
</html>
